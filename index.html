<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đánh Giá Năng Lực Ứng Viên</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 50px;
        }

        header {
            background-color: #2563eb;
            color: white;
            padding: 3rem 1rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: -2rem auto 0;
            padding: 0 1rem;
            position: relative;
            z-index: 10;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .info-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .form-group input {
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .tang-section {
            margin-top: 3rem;
        }

        .tang-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e0e7ff;
        }

        .competency-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .competency-card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .comp-header {
            margin-bottom: 1.5rem;
        }

        .comp-name {
            font-size: 1.25rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }

        .comp-def {
            color: var(--text-muted);
            font-size: 0.95rem;
            background: #f1f5f9;
            padding: 1rem;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem;
        }

        .level-option {
            position: relative;
            cursor: pointer;
        }

        .level-option input[type="radio"] {
            display: none;
        }

        .level-card {
            height: 100%;
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
        }

        .level-option input[type="radio"]:checked+.level-card {
            border-color: var(--primary);
            background-color: #eef2ff;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        .level-score {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.25rem;
            text-align: center;
        }

        .level-name {
            font-weight: 600;
            text-align: center;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
            color: #334155;
            text-transform: capitalize;
        }

        .level-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            flex-grow: 1;
        }

        .submit-container {
            text-align: center;
            margin-top: 3rem;
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 1rem 3rem;
            font-size: 1.25rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(79, 70, 229, 0.3);
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(79, 70, 229, 0.4);
        }

        /* Results Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.75);
            z-index: 100;
            overflow-y: auto;
            padding: 2rem 1rem;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: white;
            max-width: 900px;
            margin: 0 auto;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            font-size: 2rem;
            color: var(--text-muted);
            cursor: pointer;
            line-height: 1;
        }

        .close-btn:hover {
            color: var(--danger);
        }

        .results-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .results-header h2 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .results-table-wrapper {
            overflow-x: auto;
            margin-bottom: 2.5rem;
        }

        table.results-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            min-width: 700px;
        }

        table.results-table th,
        table.results-table td {
            padding: 1rem;
            border: 1px solid var(--border);
        }

        table.results-table th {
            background-color: #f8fafc;
            font-weight: 600;
            color: #334155;
        }

        .col-staff {
            color: #2563eb;
            font-weight: 600;
        }

        .col-supervisor {
            color: #dc2626;
            font-weight: 600;
        }

        .col-leader {
            color: #d97706;
            font-weight: 600;
        }

        .col-senior {
            color: #16a34a;
            font-weight: 600;
        }

        .col-candidate {
            color: var(--primary);
            font-weight: 700;
            background-color: #f0fdf4;
            font-size: 1.1rem;
        }

        .row-total {
            font-weight: 700;
            background-color: #f8fafc;
        }

        .row-total td {
            font-size: 1.1rem;
        }

        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
            margin: 0 auto;
        }

        .unanswered-warning {
            color: var(--danger);
            font-weight: 600;
            text-align: center;
            margin-bottom: 1rem;
            display: none;
        }

        @media (max-width: 1024px) {
            .levels-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .levels-grid {
                grid-template-columns: 1fr;
            }

            .info-form {
                grid-template-columns: 1fr;
            }
            
            header h1 { font-size: 1.8rem; }
            .card, .competency-card { padding: 1rem; }
            .modal-content { padding: 1.5rem; }
        }
    </style>
</head>

<body>
    <div id="appContent" style="display: none;">
    <header>
        <a href="list.html" style="position: absolute; top: 1.5rem; right: 1.5rem; background: rgba(255,255,255,0.2); color: white; text-decoration: none; padding: 0.5rem 1rem; border-radius: 8px; font-weight: 600; transition: background 0.2s; border: 1px solid rgba(255,255,255,0.3);">
            📋 Xem Danh Sách
        </a>
        <h1>Đánh Giá Khung Năng Lực Ứng Viên</h1>
        <p>Công cụ chấm điểm trực tiếp theo tiêu chuẩn</p>
    </header>

    <div class="container">
        <div class="card">
            <div class="info-form">
                <div class="form-group">
                    <label for="candidateName">Tên ứng viên</label>
                    <input type="text" id="candidateName" placeholder="Nhập tên ứng viên..." required>
                </div>
                <div class="form-group">
                    <label for="interviewerName">Người phỏng vấn</label>
                    <input type="text" id="interviewerName" placeholder="Nhập tên người phỏng vấn..." required>
                </div>
                <div class="form-group">
                    <label for="interviewDate">Ngày phỏng vấn</label>
                    <input type="date" id="interviewDate" required>
                </div>
            </div>
        </div>

        <form id="evaluationForm">
            <div id="formContent">
                <!-- Nội dung form sẽ được tạo bằng JS -->
            </div>

            <div class="unanswered-warning" id="warningMsg">
                Vui lòng đánh giá tất cả các năng lực trước khi hoàn thành!
            </div>

            <div class="submit-container">
                <button type="button" class="btn-submit" onclick="calculateResults()">Hoàn Thành & Xem Kết Quả</button>
            </div>
        </form>
    </div>

    <!-- Kết quả Modal -->
    <div id="resultsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="results-header">
                <h2>Báo Cáo Kết Quả Phỏng Vấn</h2>
                <p id="resCandidateInfo" style="font-size: 1.1rem; color: var(--text-muted);"></p>
                <div id="finalConclusion"
                    style="margin-top: 1rem; font-size: 1.25rem; font-weight: 700; color: var(--success); background-color: #f0fdf4; padding: 1rem; border-radius: 8px; border: 1px solid #bbf7d0; display: inline-block;">
                </div>
                <div style="margin-top: 1.5rem; display: flex; gap: 1rem; justify-content: center;">
                    <button onclick="exportToExcel()"
                        style="background-color: #10b981; color: white; border: none; padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2); transition: all 0.2s;">
                        <span style="margin-right: 8px;">📥</span> Xuất Excel
                    </button>
                    <button onclick="saveToServer()" id="btnSaveServer"
                        style="background-color: #4f46e5; color: white; border: none; padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2); transition: all 0.2s;">
                        <span style="margin-right: 8px;">☁️</span> Lưu lên Server
                    </button>
                    <a href="list.html" style="text-decoration: none; background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 600; border-radius: 8px; display: inline-block;">
                        Xem Danh Sách
                    </a>
                </div>
            </div>

            <div class="results-table-wrapper">
                <table class="results-table" id="resultsTable">
                    <thead>
                        <tr>
                            <th style="text-align: left; width: 35%;">Tiêu Chí</th>
                            <th class="col-staff">Staff</th>
                            <th class="col-supervisor">Supervisor</th>
                            <th class="col-leader">Leader</th>
                            <th class="col-senior">Senior Leader</th>
                            <th class="col-candidate">Điểm Ứng Viên</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTableBody">
                        <!-- Thêm bằng JS -->
                    </tbody>
                    <tfoot>
                        <tr class="row-total">
                            <td style="text-align: left;">TỔNG ĐIỂM</td>
                            <td class="col-staff" id="totStaff">47</td>
                            <td class="col-supervisor" id="totSup">62</td>
                            <td class="col-leader" id="totLead">75</td>
                            <td class="col-senior" id="totSen">88</td>
                            <td class="col-candidate" id="totCan">0</td>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <div class="chart-container">
                <canvas id="radarChart"></canvas>
            </div>
        </div>
    </div>
    </div> <!-- Close appContent -->

    <!-- Nạp dữ liệu từ data.js -->
    <script src="data.js"></script>
    <script>
        // Thiết lập ngày hiện tại
        document.getElementById('interviewDate').valueAsDate = new Date();

        const formContent = document.getElementById('formContent');

        // Render form từ competencyData
        let compCounter = 0;
        for (const t_key in competencyData) {
            const tang = competencyData[t_key];
            if (!tang.list || tang.list.length === 0) continue;

            const section = document.createElement('div');
            section.className = 'tang-section';

            const title = document.createElement('h2');
            title.className = 'tang-title';
            title.textContent = tang.name;
            section.appendChild(title);

            tang.list.forEach((comp, idx) => {
                compCounter++;
                const compCard = document.createElement('div');
                compCard.className = 'competency-card';

                const compHeader = document.createElement('div');
                compHeader.className = 'comp-header';
                compHeader.innerHTML = `
                    <div class="comp-name">${compCounter}. ${comp.name}</div>
                    <div class="comp-def">${comp.definition}</div>
                `;
                compCard.appendChild(compHeader);

                const levelsGrid = document.createElement('div');
                levelsGrid.className = 'levels-grid';

                for (let level = 1; level <= 5; level++) {
                    const lData = comp.levels[level];
                    if (!lData) continue;

                    const option = document.createElement('label');
                    option.className = 'level-option';

                    const inputId = `comp_${t_key}_${idx}_${level}`;
                    const nameAttr = `score_${t_key}_${idx}`;

                    option.innerHTML = `
                        <input type="radio" name="${nameAttr}" value="${level}" id="${inputId}">
                        <div class="level-card">
                            <div class="level-score">${level}</div>
                            <div class="level-name">${lData.name}</div>
                            <div class="level-desc">${lData.description}</div>
                        </div>
                    `;
                    levelsGrid.appendChild(option);
                }

                compCard.appendChild(levelsGrid);
                section.appendChild(compCard);
            });

            formContent.appendChild(section);
        }

        const benchmarks = {
            "T1": { Staff: 20, Supervisor: 26, Leader: 30, Senior: 33 },
            "T2": { Staff: 14, Supervisor: 17, Leader: 20, Senior: 23 },
            "T3": { Staff: 12, Supervisor: 17, Leader: 22, Senior: 28 },
            "T4": { Staff: 1, Supervisor: 2, Leader: 3, Senior: 4 }
        };

        let myChart = null;

        function calculateResults() {
            const candidateName = document.getElementById('candidateName').value.trim() || 'Ứng viên chưa nhập tên';
            const interviewerName = document.getElementById('interviewerName').value.trim() || 'Người PV chưa nhập';
            const date = document.getElementById('interviewDate').value;

            // Check if all competencies are rated
            let allAnswered = true;
            const scores = { "T1": 0, "T2": 0, "T3": 0, "T4": 0 };

            for (const t_key in competencyData) {
                const tang = competencyData[t_key];
                tang.list.forEach((comp, idx) => {
                    const nameAttr = `score_${t_key}_${idx}`;
                    const selected = document.querySelector(`input[name="${nameAttr}"]:checked`);
                    if (selected) {
                        scores[t_key] += parseInt(selected.value);
                    } else {
                        allAnswered = false;
                    }
                });
            }

            if (!allAnswered) {
                Swal.fire({ title: 'Thiếu thông tin!', text: 'Vui lòng đánh giá tất cả các năng lực trước khi hoàn thành.', icon: 'warning', confirmButtonColor: '#2563eb' });
                window.scrollTo({ top: document.getElementById('formContent').offsetTop - 100, behavior: 'smooth' });
                return;
            }

            document.getElementById('warningMsg').style.display = 'none';

            // Hiển thị modal
            document.getElementById('resultsModal').style.display = 'block';
            document.getElementById('resCandidateInfo').textContent = `Ứng viên: ${candidateName} | Người PV: ${interviewerName} | Ngày: ${date}`;

            const tbody = document.getElementById('resultsTableBody');
            tbody.innerHTML = '';

            let canTotal = 0;
            const chartLabels = [];
            const chartDataCandidate = [];
            const chartDataStaff = [];
            const chartDataSupervisor = [];
            const chartDataLeader = [];
            const chartDataSenior = [];

            for (const t_key in benchmarks) {
                const b = benchmarks[t_key];
                const cScore = scores[t_key];
                canTotal += cScore;
                const tangName = competencyData[t_key] ? competencyData[t_key].name : t_key;

                chartLabels.push(tangName);
                chartDataCandidate.push(cScore);
                chartDataStaff.push(b.Staff);
                chartDataSupervisor.push(b.Supervisor);
                chartDataLeader.push(b.Leader);
                chartDataSenior.push(b.Senior);

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="text-align: left; font-weight: 600;">${tangName}</td>
                    <td>${b.Staff}</td>
                    <td>${b.Supervisor}</td>
                    <td>${b.Leader}</td>
                    <td>${b.Senior}</td>
                    <td class="col-candidate">${cScore}</td>
                `;
                tbody.appendChild(tr);
            }

            document.getElementById('totCan').textContent = canTotal;

            const diffs = [
                { level: 'Staff', score: 47, diff: Math.abs(canTotal - 47) },
                { level: 'Supervisor', score: 62, diff: Math.abs(canTotal - 62) },
                { level: 'Leader', score: 75, diff: Math.abs(canTotal - 75) },
                { level: 'Senior Leader', score: 88, diff: Math.abs(canTotal - 88) }
            ];
            diffs.sort((a, b) => a.diff - b.diff);
            const bestFit = diffs[0].level;

            document.getElementById('finalConclusion').innerHTML = `Đánh giá chung: Phù hợp với mức <span style="color: var(--primary); text-transform: uppercase;">${bestFit}</span>`;

            // Draw Chart
            const ctx = document.getElementById('radarChart').getContext('2d');
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: chartLabels,
                    datasets: [
                        {
                            label: 'Ứng viên',
                            data: chartDataCandidate,
                            backgroundColor: 'rgba(79, 70, 229, 0.4)',
                            borderColor: 'rgba(79, 70, 229, 1)',
                            pointBackgroundColor: 'rgba(79, 70, 229, 1)',
                            borderWidth: 3,
                        },
                        {
                            label: 'Staff',
                            data: chartDataStaff,
                            backgroundColor: 'rgba(37, 99, 235, 0)',
                            borderColor: '#2563eb',
                            borderWidth: 1,
                            borderDash: [5, 5]
                        },
                        {
                            label: 'Supervisor',
                            data: chartDataSupervisor,
                            backgroundColor: 'rgba(220, 38, 38, 0)',
                            borderColor: '#dc2626',
                            borderWidth: 1,
                            borderDash: [5, 5]
                        },
                        {
                            label: 'Leader',
                            data: chartDataLeader,
                            backgroundColor: 'rgba(217, 119, 6, 0)',
                            borderColor: '#d97706',
                            borderWidth: 1,
                            borderDash: [5, 5]
                        },
                        {
                            label: 'Senior Leader',
                            data: chartDataSenior,
                            backgroundColor: 'rgba(22, 163, 74, 0)',
                            borderColor: '#16a34a',
                            borderWidth: 2,
                            borderDash: [5, 5]
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            beginAtZero: true,
                            angleLines: { color: 'rgba(0, 0, 0, 0.1)' },
                            grid: { color: 'rgba(0, 0, 0, 0.1)' }
                        }
                    },
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }

        function closeModal() {
            document.getElementById('resultsModal').style.display = 'none';
        }

        function exportToExcel() {
            const candidateName = document.getElementById('candidateName').value.trim() || 'Ung_Vien';
            const interviewerName = document.getElementById('interviewerName').value.trim();
            const date = document.getElementById('interviewDate').value;

            const wb = XLSX.utils.book_new();

            const aoaSummary = [
                ["BÁO CÁO KẾT QUẢ PHỎNG VẤN"],
                [`Ứng viên: ${candidateName}`, `Người PV: ${interviewerName}`, `Ngày: ${date}`],
                [`Kết luận: ${document.getElementById('finalConclusion').innerText}`],
                [],
                ["Tiêu Chí", "Staff", "Supervisor", "Leader", "Senior Leader", "Điểm Ứng Viên"]
            ];

            let canTotal = 0;
            for (const t_key in benchmarks) {
                const b = benchmarks[t_key];
                let cScore = 0;
                const tang = competencyData[t_key];
                if (tang && tang.list) {
                    tang.list.forEach((comp, idx) => {
                        const nameAttr = `score_${t_key}_${idx}`;
                        const selected = document.querySelector(`input[name="${nameAttr}"]:checked`);
                        if (selected) cScore += parseInt(selected.value);
                    });
                }
                canTotal += cScore;

                const tangName = tang ? tang.name : t_key;
                aoaSummary.push([tangName, b.Staff, b.Supervisor, b.Leader, b.Senior, cScore]);
            }
            aoaSummary.push(["TỔNG ĐIỂM", 47, 62, 75, 88, canTotal]);

            const wsSummary = XLSX.utils.aoa_to_sheet(aoaSummary);
            wsSummary['!cols'] = [{ wch: 35 }, { wch: 10 }, { wch: 15 }, { wch: 10 }, { wch: 15 }, { wch: 15 }];

            const aoaDetail = [
                ["CHI TIẾT ĐÁNH GIÁ NĂNG LỰC"],
                [`Ứng viên: ${candidateName}`],
                [],
                ["Tầng Năng Lực", "Tên Năng Lực", "Mức Điểm", "Diễn Giải Mức Điểm"]
            ];

            for (const t_key in competencyData) {
                const tang = competencyData[t_key];
                if (tang && tang.list) {
                    tang.list.forEach((comp, idx) => {
                        const nameAttr = `score_${t_key}_${idx}`;
                        const selected = document.querySelector(`input[name="${nameAttr}"]:checked`);
                        const score = selected ? parseInt(selected.value) : 0;
                        const desc = score > 0 && comp.levels && comp.levels[score] ? comp.levels[score].description : "";

                        aoaDetail.push([tang.name, comp.name, score, desc]);
                    });
                }
            }

            const wsDetail = XLSX.utils.aoa_to_sheet(aoaDetail);
            wsDetail['!cols'] = [{ wch: 30 }, { wch: 40 }, { wch: 10 }, { wch: 80 }];

            XLSX.utils.book_append_sheet(wb, wsSummary, "Tổng Hợp");
            XLSX.utils.book_append_sheet(wb, wsDetail, "Chi Tiết");

            XLSX.writeFile(wb, `Danh_Gia_${candidateName.replace(/\\s+/g, '_')}_${date}.xlsx`);
        }

        async function saveToServer() {
            const btn = document.getElementById('btnSaveServer');
            btn.innerHTML = 'Đang lưu...';
            btn.disabled = true;

            const candidateName = document.getElementById('candidateName').value.trim();
            const interviewerName = document.getElementById('interviewerName').value.trim();
            const date = document.getElementById('interviewDate').value;
            const finalLevel = document.getElementById('finalConclusion').innerText.replace('Đánh giá chung: Phù hợp với mức ', '').trim();

            let canTotal = parseInt(document.getElementById('totCan').textContent) || 0;
            const scores = { "T1": 0, "T2": 0, "T3": 0, "T4": 0 };
            const details = [];

            for (const t_key in competencyData) {
                const tang = competencyData[t_key];
                if (tang && tang.list) {
                    tang.list.forEach((comp, idx) => {
                        const nameAttr = `score_${t_key}_${idx}`;
                        const selected = document.querySelector(`input[name="${nameAttr}"]:checked`);
                        const score = selected ? parseInt(selected.value) : 0;
                        if (score > 0) {
                            scores[t_key] += score;
                            details.push({
                                TangName: tang.name,
                                CompetencyName: comp.name,
                                Score: score,
                                Description: comp.levels[score] ? comp.levels[score].description : ""
                            });
                        }
                    });
                }
            }

            const payload = {
                candidateName: candidateName || 'Chưa nhập',
                interviewerName: interviewerName || 'Chưa nhập',
                interviewDate: date,
                t1_score: scores.T1,
                t2_score: scores.T2,
                t3_score: scores.T3,
                t4_score: scores.T4,
                total_score: canTotal,
                final_level: finalLevel,
                details: details
            };

            try {
                const res = await fetch('/api/candidates', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-auth-token': localStorage.getItem('dguv_token')
                    },
                    body: JSON.stringify(payload)
                });

                if (res.status === 401) {
                    localStorage.removeItem('dguv_token');
                    await Swal.fire('Lỗi', 'Hết phiên đăng nhập. Vui lòng đăng nhập lại.', 'error');
                    btn.innerHTML = '☁️ Lưu lên Server';
                    btn.disabled = false;
                    document.getElementById('appContent').style.display = 'none';
                    return await promptLogin();
                }

                const data = await res.json();
                if (data.success) {
                    Swal.fire({ title: 'Thành công!', text: 'Lưu thành công vào Database.', icon: 'success', confirmButtonColor: '#10b981' });
                    btn.innerHTML = '✅ Đã lưu';
                } else {
                    Swal.fire({ title: 'Lỗi!', text: data.message, icon: 'error', confirmButtonColor: '#ef4444' });
                    btn.innerHTML = '☁️ Lưu lên Server';
                    btn.disabled = false;
                }
            } catch (err) {
                Swal.fire({ title: 'Lỗi kết nối!', text: 'Không thể kết nối đến server. Vui lòng kiểm tra server.js đã chạy chưa.', icon: 'error', confirmButtonColor: '#ef4444' });
                console.error(err);
                btn.innerHTML = '☁️ Lưu lên Server';
                btn.disabled = false;
            }
        }
        const promptLogin = async () => {
            const { value: formValues } = await Swal.fire({
                title: 'Đăng Nhập Hệ Thống',
                html:
                    '<input id="swal-input1" class="swal2-input" placeholder="Tên đăng nhập (admin)">' +
                    '<input id="swal-input2" class="swal2-input" type="password" placeholder="Mật khẩu">',
                focusConfirm: false,
                allowOutsideClick: false,
                allowEscapeKey: false,
                confirmButtonText: 'Đăng Nhập',
                confirmButtonColor: '#2563eb',
                preConfirm: () => {
                    return [
                        document.getElementById('swal-input1').value,
                        document.getElementById('swal-input2').value
                    ]
                }
            });

            if (formValues) {
                try {
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: formValues[0], password: formValues[1] })
                    });
                    const data = await res.json();
                    if (data.success) {
                        localStorage.setItem('dguv_token', data.token);
                        Swal.fire({title: 'Thành công!', text: 'Đăng nhập thành công', icon: 'success', timer: 1500, showConfirmButton: false});
                        document.getElementById('appContent').style.display = 'block';
                        return data.token;
                    } else {
                        await Swal.fire('Lỗi', 'Sai tài khoản hoặc mật khẩu!', 'error');
                        return await promptLogin();
                    }
                } catch (e) {
                    await Swal.fire('Lỗi', 'Không thể kết nối đến server.', 'error');
                    return await promptLogin();
                }
            }
        };

        window.onload = async () => {
            const token = localStorage.getItem('dguv_token');
            if (!token) {
                await promptLogin();
            } else {
                document.getElementById('appContent').style.display = 'block';
            }
        };
    </script>
